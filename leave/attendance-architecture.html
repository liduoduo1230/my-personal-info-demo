<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考勤系统架构图</title>
    <style>
      :root {
        --brand-dark: #3b3431;
        --brand-paper: #f7f6f3;
        --brand-line: #d0d3d6;
        --brand-gold: #b78f62;
        --brand-gold-soft: #f5e8c8;
        --text-secondary: #646a73;
        --surface: #ffffff;
        --info-soft: #f0f4ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--brand-dark);
        background: var(--brand-paper);
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
        padding: 12px 20px;
        color: #fff;
        background: var(--brand-dark);
        box-shadow: 0 8px 20px rgba(59, 52, 49, 0.16);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        line-height: 26px;
      }

      .title p {
        margin: 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button {
        min-height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        padding: 0 12px;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        cursor: pointer;
      }

      .zoom-value {
        min-width: 58px;
        color: rgba(255, 255, 255, 0.82);
        text-align: center;
        font-size: 12px;
      }

      .canvas-shell {
        height: calc(100vh - 64px);
        overflow: auto;
        padding: 24px;
        cursor: grab;
      }

      .canvas-shell.dragging {
        cursor: grabbing;
        user-select: none;
      }

      .diagram-stage {
        width: 1680px;
        height: 1160px;
        transform-origin: 0 0;
      }

      svg {
        display: block;
        width: 1680px;
        height: 1160px;
        border: 1px solid var(--brand-line);
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(59, 52, 49, 0.12);
      }

      .layer-title {
        font-size: 24px;
        font-weight: 700;
        fill: var(--brand-dark);
      }

      .node-title {
        font-size: 16px;
        font-weight: 700;
        fill: #1f2329;
      }

      .node-sub {
        font-size: 12px;
        fill: var(--text-secondary);
      }

      .group-label {
        font-size: 18px;
        font-weight: 700;
        fill: var(--brand-dark);
      }

      .hint {
        font-size: 13px;
        fill: var(--text-secondary);
      }

      @media (max-width: 720px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .canvas-shell {
          height: calc(100vh - 118px);
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <h1>考勤系统架构图</h1>
        <p>滚轮或按钮缩放，按住空白区域拖动查看</p>
      </div>
      <div class="toolbar" aria-label="缩放控制">
        <button id="zoomOut" type="button">缩小</button>
        <span id="zoomValue" class="zoom-value">100%</span>
        <button id="zoomIn" type="button">放大</button>

    <script>
      const canvas = document.querySelector("#canvas");
      const stage = document.querySelector("#stage");
      const zoomValue = document.querySelector("#zoomValue");
      let scale = 1;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let scrollLeft = 0;
      let scrollTop = 0;

      function setZoom(nextScale) {
        scale = Math.min(2.4, Math.max(0.45, nextScale));
        stage.style.transform = `scale(${scale})`;
        stage.style.width = `${1680 * scale}px`;
        stage.style.height = `${1160 * scale}px`;
        zoomValue.textContent = `${Math.round(scale * 100)}%`;
      }

      document.querySelector("#zoomIn").addEventListener("click", () => setZoom(scale + 0.15));
      document.querySelector("#zoomOut").addEventListener("click", () => setZoom(scale - 0.15));
      document.querySelector("#reset").addEventListener("click", () => {
        setZoom(1);
        canvas.scrollTo({ left: 0, top: 0, behavior: "smooth" });
      });

      canvas.addEventListener("wheel", (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        setZoom(scale + (event.deltaY < 0 ? 0.12 : -0.12));
      }, { passive: false });

      canvas.addEventListener("mousedown", (event) => {
        dragging = true;
        canvas.classList.add("dragging");
        startX = event.pageX;
        startY = event.pageY;
        scrollLeft = canvas.scrollLeft;
        scrollTop = canvas.scrollTop;
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
        canvas.classList.remove("dragging");
      });

      canvas.addEventListener("mousemove", (event) => {
        if (!dragging) return;
        canvas.scrollLeft = scrollLeft - (event.pageX - startX);
        canvas.scrollTop = scrollTop - (event.pageY - startY);
      });

      setZoom(1);
    </script>
  </body>
</html>
